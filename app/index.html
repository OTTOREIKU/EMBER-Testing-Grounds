<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1216" />
  <title>EMBER Testing Grounds</title>
  <meta name="description" content="Reference, table companion and virtual tabletop for EMBER: Obsidian Protocol. An unofficial fan tool." />
  <link rel="stylesheet" href="./src/landing.css" />
</head>
<body>
  <main class="land">
    <!-- The dressing: a whole Mech drawn faint from its Parts, a glow, a grid,
         the subtitle as a vertical watermark and an original barcode strip.
         All decorative, so hidden from assistive tech. -->
    <div class="land-deco" aria-hidden="true">
      <div class="land-glow"></div>
      <div class="land-grid"></div>
      <div class="land-mech" id="land-mech"></div>
      <div class="land-zh">黑曜协议</div>
      <svg class="land-bars land-strip" data-seed="EMBEROBSIDIANPROTOCOLTESTINGGROUNDS" data-vertical="1"></svg>
      <span class="land-corner tl"></span><span class="land-corner tr"></span>
      <span class="land-corner bl"></span><span class="land-corner br"></span>
    </div>

    <div class="land-status" aria-hidden="true"><span>SYS // TG-01</span><span>LINK <b>OK</b></span></div>

    <header class="land-mark">
      <div class="land-kicker">ONLINE TOOLS</div>
      <h1>EMBER<br><span>Testing Grounds</span></h1>
      <svg class="land-bars land-code" data-seed="TESTINGGROUNDS" aria-hidden="true"></svg>
    </header>

    <nav class="land-nav" aria-label="Sections">
      <a class="land-row" href="./reference/"><code>REF</code><b>Reference</b><em>READ</em><span class="land-go" aria-hidden="true">›</span></a>
      <a class="land-row" href="./pad/"><code>PAD</code><b>Pad</b><em>PLAY</em><span class="land-go" aria-hidden="true">›</span></a>
      <a class="land-row" id="land-table" href="./table/"><code>TBL</code><b>Tabletop</b><em>VIRTUAL</em><span class="land-go" aria-hidden="true">›</span></a>
    </nav>

    <footer class="land-foot"><span>UNOFFICIAL FAN TOOL</span><span>EMBERTG.ONLINE</span></footer>
  </main>
  <script type="module" src="./src/landing.ts"></script>
</body>
</html>
