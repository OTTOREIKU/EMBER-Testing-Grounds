<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- What this page may load, and from where. Scripts run only from this site (plus the inline base line below, by its hash), so markup that
       slips into the page through a name or a log line can never execute. Everything else comes from this
       site too: styles (and inline style attributes), images (and the generated data: ones), and requests,
       which may also go to the API. The two :3002 entries are a developer's local API and reach nothing on
       the live site, where a page served over https cannot call plain http. No frames, no plugins. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-MMrmsclROZtb9kICV79+pMbhdBdPKEF5wFIigAKAqXQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.embertg.online wss://api.embertg.online http://*:3002 ws://*:3002; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#17181c" />
  <title>EMBER Reference</title>
  <!-- The site mark: a barcode on the dark tile, white bars for the E and amber for TG. /favicon.ico is also what a
       browser asks for on its own; the SVG is sharp at any size. -->
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
</head>
<body class="ref-body">
  <header id="ref-head">
    <!-- No link back to the tabletop: this page is read on a phone beside a
         physical game far more often than it is opened from the board, so it
         stands on its own. The one outbound link is the publisher's own English
         rulebook, which is what this page is a companion to rather than a
         replacement for - anything we summarise, it settles.
         HIDDEN since 2026-09-29 (OTTO): the publisher's page broke and now
         lands somewhere that looks unsafe. Drop `hidden` to bring it back. -->
    <div class="ref-sys">
      <a class="ui-home" href="../"><b>‹</b>EMBER</a>
      <span class="ref-sys-code">REF // <b>Reference</b></span>
      <span class="ref-sys-r">
        <a id="ref-pdf" hidden href="https://www.obsidianprotocol.com/?page_id=16938"
           target="_blank" rel="noopener noreferrer"
           title="The official English rulebook on obsidianprotocol.com. Opens in a new tab.">Rules PDF ↗</a>
        <button id="ref-report" title="Tell me a card here does not match the one in your hand">Something wrong?</button>
      </span>
    </div>
    <div class="ref-wordmark">
      <span id="ref-logo">EMBER <em>Reference</em></span>
      <span id="ref-code" aria-hidden="true"></span>
    </div>
    <input type="search" id="ref-search" placeholder="Search keywords, parts, units, pilots…" autocomplete="off" />
    <nav id="ref-tabs">
      <button data-tab="keywords" class="active">Keywords</button>
      <button data-tab="parts">Parts</button>
      <button data-tab="units">Units</button>
      <button data-tab="pilots">Pilots</button>
      <button data-tab="tactics">Tactics</button>
      <button data-tab="missions">Missions</button>
      <button data-tab="battlefield">Battlefield</button>
      <button data-tab="factions">Factions</button>
      <button data-tab="boxes">Boxes</button>
      <button data-tab="rules">Rules</button>
    </nav>
  </header>
  <main id="ref-body">
    <p class="ref-loading">Loading…</p>
  </main>
  <div id="ref-detail" hidden>
    <div class="ref-detail-inner">
      <div class="ref-detail-tools">
        <button id="ref-detail-back" title="Back" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5" /><path d="m12 19-7-7 7-7" />
          </svg>
        </button>
        <button id="ref-detail-report" title="Report a problem with this card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 21V4a6 6 0 0 1 8 0 6 6 0 0 0 8 0v9a6 6 0 0 1-8 0 6 6 0 0 0-8 0" />
          </svg>
        </button>
        <button id="ref-detail-close" title="Close">✕</button>
      </div>
      <div id="ref-detail-content"></div>
    </div>
  </div>
  <!-- Served from a FOLDER (/reference) so the address stays short, like /pad:
       /data and /assets are one level up. Declared before any module loads;
       see the note over BASE in src/data.ts. -->
  <script>window.__EMBER_BASE__ = "../";</script>
  <script type="module" src="../src/reference.ts"></script>
</body>
</html>
