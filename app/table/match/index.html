<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- What this page may load, and from where. Scripts run only from this site (plus the inline base line below, by its hash), so markup that
         slips into the page through a name or a log line can never execute. Everything else comes from this
         site too: styles (and inline style attributes), images (and the generated data: ones), and requests,
         which may also go to the API. The two :3002 entries are a developer's local API and reach nothing on
         the live site, where a page served over https cannot call plain http. No frames, no plugins. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-xownSHIVBf2roKfxZTZgpBOfBQyF1TtylEdwBF6ryw8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.embertg.online wss://api.embertg.online http://*:3002 ws://*:3002; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Match Centre · EMBER Testing Grounds</title>
    <!-- The site mark: a barcode on the dark tile, white bars for the E and amber for TG. /favicon.ico is also what a
         browser asks for on its own; the SVG is sharp at any size. -->
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
    <!-- The board renderer's styles first, so the match page draws the same
         battlefield as freeplay; match.css then owns the page chrome. -->
    <link rel="stylesheet" href="../../src/styles.css" />
    <link rel="stylesheet" href="../../src/match.css" />
  </head>
  <body>
    <div id="mc" class="mc"></div>
    <!-- Served from /table/match, so /data and /assets are two levels up. -->
    <script>window.__EMBER_BASE__ = "../../";</script>
    <script type="module" src="../../src/match.ts"></script>
  </body>
</html>
