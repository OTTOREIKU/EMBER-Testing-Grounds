<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Match Centre · EMBER Testing Grounds</title>
    <!-- The site mark: a barcode on the dark tile, white bars for the E and amber for TG. /favicon.ico is also what a
         browser asks for on its own; the SVG is sharp at any size. -->
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
    <!-- The board renderer's styles first, so the match page draws the same
         battlefield as freeplay; match.css then owns the page chrome. -->
    <link rel="stylesheet" href="../../src/styles.css" />
    <link rel="stylesheet" href="../../src/match.css" />
  </head>
  <body>
    <div id="mc" class="mc"></div>
    <!-- Served from /table/match, so /data and /assets are two levels up. -->
    <script>window.__EMBER_BASE__ = "../../";</script>
    <script type="module" src="../../src/match.ts"></script>
  </body>
</html>
